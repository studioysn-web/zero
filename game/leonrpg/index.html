<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>レオンアドベンチャー</title>
  <style>
    body { background:#222; color:#fff; text-align:center; margin:0; padding:0; }

    canvas {
      background:#000;
      display:block;
      margin:20px auto;
      border:4px solid #fff;
      width: 60vw;   /* ← 画面幅の60%に縮小 */
      height: auto;  /* ← 比率維持して高さが決まる */
    }

    #statusUI {
      position: fixed;
      top: 10px;
      left: 10px;
      width: 200px;
      padding: 10px;
      background: rgba(0,0,0,0.5);
      color: white;
      font-family: sans-serif;
      border: 2px solid white;
      z-index: 0;
      text-align: left;
      user-select: none;
    }
    #statusUI .line { margin-bottom: 6px; }

    #controllerArea {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 100;
      pointer-events: none; /* ★ コントローラーエリア背景によるタッチ横取りを防止 */
    }

    .close-tab-btn {
      position: absolute;
      top: 0px;
      right: 10px;
      padding: 10px 18px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      pointer-events: auto;
      user-select: none;
    }

    .dpad {
      position: absolute;
      bottom: 140px;
      left: 20px;
      width: 180px;
      height: 180px;
      pointer-events: auto;
    }

    .btn {
      position: absolute;
      width: 60px;
      height: 60px;
      font-size: 26px;
      font-weight: bold;
      background: rgba(4, 219, 226, 0.15);
      border: 2px solid rgba(22, 170, 138, 0.35);
      border-radius: 14px;
      color: #fff;
      user-select: none;
      pointer-events: auto;
    }

    .btn.up    { top: 0; left: 50%; transform: translateX(-50%); }
    .btn.left  { top: 50%; left: 0; transform: translateY(-50%); }
    .btn.right { top: 50%; right: 0; transform: translateY(-50%); }
    .btn.down  { bottom: 0; left: 50%; transform: translateX(-50%); }

    .action-pad {
      position: absolute;
      bottom: 140px;
      right: 20px;
      width: 200px;
      height: 200px;
      pointer-events: auto;
    }

    .act-btn {
      position: absolute;
      width: 80px;
      height: 80px;
      font-size: 28px;
      font-weight: bold;
      background: rgba(255,80,80,0.25);
      border: 2px solid rgba(255,255,255,0.35);
      border-radius: 50%;
      color: #fff;
      user-select: none;
      pointer-events: auto;
    }

    @media (orientation: landscape) and (max-height: 600px) {
      canvas {
        width: 36vw;
        height: auto;
      }
      .dpad {
        bottom: 0px !important;
        left: 1px;
      }

      .action-pad {
        bottom: 0px !important;
        right: 20px;
        width: 180px;
        height: 185px;
      }
      #statusUI {
        top: 0px;
        left: 170px;
        font-size:8px;
        width: 75px;
      }
    }
    
    @media (orientation: portrait) and (max-width: 600px) {
      canvas {
        width: 95vw;
        height: auto;
      }
      .dpad {
        bottom: 80px !important;
        left: 1px;
      }

      .action-pad {
        bottom: 0px !important;
        right: 20px;
        width: 180px;
        height: 270px;
      }
      #statusUI {
        top: 305px;
        left: 5px;
        font-size:8px;
        width: 95px;
      }
      .close-tab-btn {
        top:0px;
      }
    }
    .act-btn.z { bottom: 50px; left: 0; }
    .act-btn.x { bottom: 50px; right: 0;}
    .act-btn.c { top: -40px; left: 50%; transform: translateX(-50%); }

  .score-btn {
    width: 220px;
    padding: 12px;
    margin: 10px 0;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: block;
    margin-left: auto;
    margin-right: auto;
    background: #4CAF50;
    color: white;
    pointer-events: auto;
  }

  .score-btn.cancel {
    background: #d9534f;
  }

.title-btn{
  width:180px;
  height:42px;
  margin:10px 10px;
  font-size:15px;
  font-weight:bold;
  color:#fff;
  background:
    linear-gradient(
      to bottom,
      #7fe1fa 0%,
      #158c91 50%,
      #0c3d3d 100%
    );
  border:1px solid #ffffff;
  border-radius:8px;
  box-shadow:
    0 0 0 2px #203080,
    0 6px 16px rgba(0,0,0,0.5);
  text-shadow:
    2px 2px 0 #000;
  cursor:pointer;
  pointer-events: auto; /* ★ スマホで確実にタップできるように設定 */
  touch-action: manipulation;
}

.title-btn:hover{
  filter:brightness(1.15);
}

.title-btn:active{
  transform:translateY(3px);
}
  </style>
</head>

<body>

<div id="statusUI">
  <div class="line">たいりょく: <span id="uiHp"></span></div>
  <div class="line">そうび(Z): <span id="uiAtk"></span></div>
  <div class="line">鉄くず(Z): <span id="uiBullets"></span></div>
  <div class="line">かいふく(X): <span id="uiHeals"></span></div>
  <div class="line">Gold: <span id="uiGold"></span></div>
  <div class="line">逃亡(C)</div>
  <div class="line">経過時間: <span id="uiTime"></span></div>
</div>

<div id="titleButtons" style="
  text-align:center;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  z-index:999999; /* ★ 他のレイヤーに邪魔されないよう最前面に */
  display:none;
  pointer-events: auto;
">

<button id="btnNewGame" class="title-btn newgame">
  はじめから
</button>

<button id="btnContinue" class="title-btn continue">
  つづきから
</button>

</div>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<div id="scoreEntry"
     style="position:absolute; top:55%; left:50%;
            transform:translate(-50%, -50%);
            background:rgba(0,0,0,0.85);
            padding:20px; color:white;
            border:2px solid #fff;
            border-radius:10px;
            display:none; z-index:99999;
            text-align:center;">

  <div style="font-size:20px; margin-bottom:10px;">
    名前を入力してください
  </div>

  <input type="text" id="userName" maxlength="10"
         style="font-size:20px; padding:5px; width:200px;"><br><br>

  <button id="registerScoreBtn" class="score-btn">
    このスコアを登録
  </button>

  <button id="cancelScoreBtn" class="score-btn cancel">
    キャンセル
  </button>

  <div id="scoreEntryResult" style="margin-top:10px; font-size:16px;"></div>
</div>

<div id="controllerArea">

  <div class="dpad">
    <button class="btn up" id="btnUp">↑</button>
    <button class="btn left" id="btnLeft">←</button>
    <button class="btn right" id="btnRight">→</button>
    <button class="btn down" id="btnDown">↓</button>
  </div>

  <div class="action-pad">
    <button class="act-btn z" id="btnZ">Z</button>
    <button class="act-btn x" id="btnX">X</button>
    <button class="act-btn c" id="btnC">C</button>
  </div>

</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js";

// ★ Supabase 接続
const supabase = createClient(
  "https://gsgtgryjwdqhzzbcbssy.supabase.co",
  "sb_publishable_yM2UbH1x_AzebIX5WECr-w_-WbVIGrb"
);

// ★ ハイスコア取得
window.loadHighScore = async function () {
  const { data, error } = await supabase
    .from("studio_ysn_table")
    .select("SCORE")
    .eq("GAMEID", 5)
    .order("SCORE", { ascending: false })
    .limit(1);

  if (error || !data || data.length === 0) return 0;
  return data[0].SCORE;
};

// ★ スコア登録ボタン
document.getElementById("registerScoreBtn").addEventListener("click", async () => {
  const name = document.getElementById("userName").value.trim();
  const panel = document.getElementById("scoreEntry");
  const score = Number(panel.dataset.score);

  if (!name) {
    document.getElementById("scoreEntryResult").innerText = "名前を入力してください。";
    return;
  }

  const { data, error } = await supabase
    .from("studio_ysn_table")
    .insert([
      {
        GAMEID: 5,
        USERID: name,
        SCORE: score,
        ENTRYTIME: new Date().toISOString()
      }
    ]);

  if (error) {
    document.getElementById("scoreEntryResult").innerText = "登録失敗: " + error.message;
  } else {
    window.highScore = await window.loadHighScore();
    panel.style.display = "none";
  }
});

// ★ キャンセルボタン
document.getElementById("cancelScoreBtn").addEventListener("click", () => {
  document.getElementById("scoreEntry").style.display = "none";
  document.getElementById("scoreEntryResult").innerText = "";
});

</script>
<script src="./js/mapLoader.js"></script>
<script src="./js/main.js"></script>
<script src="./js/battle.js"></script>

<script>
function updateTitleButtons() {
  const area = document.getElementById("titleButtons");
  const canvas = document.getElementById("gameCanvas");

  if (!area || !canvas) return;

  if (gameState !== "title") {
    area.style.display = "none";
    return;
  }

  const rect = canvas.getBoundingClientRect();
  if (rect.width === 0 || rect.height === 0) return;

  area.style.display = "block";

  // Canvas の高さの 50% 付近に配置
  const targetTop = rect.top + (rect.height * 0.54) + window.scrollY;
  area.style.top = targetTop + "px";

  const continueBtn = document.getElementById("btnContinue");
  if (continueBtn) {
    continueBtn.style.display = localStorage.getItem("PB_SAVE")
      ? "inline-block"
      : "none";
  }
}

window.addEventListener("resize", updateTitleButtons);
window.addEventListener("orientationchange", updateTitleButtons);

// ★ スマホで反応するように click と pointerdown の両方で処理できるように設定
function setupGameStartButtons() {
  const handleNewGame = (e) => {
    e.preventDefault();
    console.log("NEW GAME START");
    localStorage.removeItem("PB_SAVE");
    forceNewGame = true;
    startGame();
  };

  const handleContinue = (e) => {
    e.preventDefault();
    console.log("CONTINUE START");
    forceNewGame = false;
    startGame();
  };

  const btnNew = document.getElementById("btnNewGame");
  const btnCont = document.getElementById("btnContinue");

  if (btnNew) {
    btnNew.addEventListener("pointerdown", handleNewGame);
    btnNew.addEventListener("click", handleNewGame);
  }
  if (btnCont) {
    btnCont.addEventListener("pointerdown", handleContinue);
    btnCont.addEventListener("click", handleContinue);
  }
}

setupGameStartButtons();

setInterval(updateTitleButtons, 100);
document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup",   e => keys[e.code] = false);

// ★ スマホタッチ → keydown / keyup を人工発火
function bindMobileKey(btnId, keyCode) {
  const btn = document.getElementById(btnId);
  if (!btn) return;

  const down = () => {
    document.dispatchEvent(new KeyboardEvent("keydown", { code: keyCode }));
  };

  const up = () => {
    document.dispatchEvent(new KeyboardEvent("keyup", { code: keyCode }));
  };

  btn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    down();
  });

  btn.addEventListener("pointerup", (e) => {
    e.preventDefault();
    up();
  });

  btn.addEventListener("pointercancel", (e) => {
    e.preventDefault();
    up();
  });

  btn.addEventListener("pointerleave", (e) => {
    e.preventDefault();
    up();
  });
}

bindMobileKey("btnZ", "KeyZ");
bindMobileKey("btnX", "KeyX");
bindMobileKey("btnC", "KeyC");
bindMobileKey("btnUp", "ArrowUp");
bindMobileKey("btnDown", "ArrowDown");
bindMobileKey("btnLeft", "ArrowLeft");
bindMobileKey("btnRight", "ArrowRight");

</script>

<div id="playerHpBar" style="
  position:absolute;
  top: 23px;
  left:50%;
  transform:translateX(-50%);
  width:160px;
  height:14px;
  background:rgba(0,0,0,0.35);
  border:1px solid rgba(255,255,255,0.6);
  border-radius:4px;
  overflow:hidden;
  z-index:9999;
">
  <div id="playerHpFill" style="
    height:100%;
    width:100%;
    background:rgba(93, 247, 4, 0.9);
  "></div>
</div>

<script>
  let isMoviePlaying = false;

  document.addEventListener("selectstart", (e) => {
    e.preventDefault();
  });

  document.addEventListener("touchstart", (e) => {

    if (isMoviePlaying) {
      return;
    }

    // ★ タイトルボタン（btnNewGame, btnContinue, titleButtons）を許可リストに追加
    const allowIds = [
      "titleButtons",
      "btnNewGame",
      "btnContinue",
      "scoreEntry",
      "registerScoreBtn",
      "cancelScoreBtn",
      "endingRegisterBtn",
      "endingCancelBtn",
      "btnZ", "btnX", "btnC",
      "btnUp", "btnDown", "btnLeft", "btnRight"
    ];

    let el = e.target;
    let hit = false;

    while (el) {
      if (allowIds.includes(el.id)) {
        hit = true;
        break;
      }
      el = el.parentElement;
    }

    if (hit) {
      return;
    }

    if (e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
      e.preventDefault();
    }

  }, { passive: false });

  document.addEventListener("contextmenu", (e) => {
    e.preventDefault();
  });

  function startMovie() {
    isMoviePlaying = true;
  }

  function endMovie() {
    isMoviePlaying = false;
  }
</script>

</body>
