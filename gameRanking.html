<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ランキング確認 - ピュアゴールド</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      /* 背景画像を右側に固定しつつ、金ぴかのグラデーションを重ねる設定 */
      background-image: 
        linear-gradient(135deg, rgba(255, 232, 117, 0.85) 0%, rgba(255, 215, 0, 0.85) 25%, rgba(255, 165, 0, 0.85) 50%, rgba(255, 215, 0, 0.85) 75%, rgba(255, 241, 176, 0.85) 100%),
        url("img/gameRank/rankingBack.png");
      background-size: cover;
      background-position: right center; /* ← ここを右寄せに変更しました */
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: #3b2706;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    h1 {
      text-align: center;
      letter-spacing: 0.3em;
      font-weight: 900;
      font-size: 36px;
      margin-bottom: 25px;
      color: #ffffff;
      text-shadow: 0 0 15px #ffcc00, 0 0 30px #ff9900, 0 2px 5px rgba(100,60,0,0.6);
      -webkit-text-stroke: 1px #805500;
    }

    .back-btn {
      display: block;
      width: 140px;
      margin: 15px auto;
      padding: 12px;
      text-align: center;
      background: linear-gradient(135deg, #ffffff, #ffea75);
      border-radius: 30px;
      color: #704200;
      text-decoration: none;
      border: 2px solid #ffffff;
      box-shadow: 0 6px 20px rgba(180,120,0,0.4), inset 0 2px 4px rgba(255,255,255,1);
      font-weight: 900;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      background: linear-gradient(135deg, #fff7bd, #ffffff);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(200,130,0,0.6), inset 0 2px 6px rgba(255,255,255,1);
    }

    .game-block {
      margin: 0 auto 35px auto;
      max-width: 520px;
      /* ブロックも眩しいゴールド光沢に */
      background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,235,140,0.9));
      border-radius: 20px;
      padding: 20px 24px 24px;
      box-shadow: 0 20px 40px rgba(130,80,0,0.4), inset 0 2px 4px rgba(255,255,255,1);
      border: 3px solid #ffffff;
      position: relative;
      overflow: hidden;
    }

    .game-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 15px;
      color: #613d00;
      text-align: center;
      letter-spacing: 0.05em;
      text-shadow: 0 1px 2px rgba(255,255,255,1);
      border-bottom: 3px double #d4af37;
      padding-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 8px 6px;
      text-align: center;
    }

    th {
      font-weight: 800;
      color: #704200;
      border-bottom: 2px solid #c79c2e;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.05em;
    }

    /* テーブル行のストライプ：輝くゴールドトーン */
    tr:nth-child(odd) td {
      background: rgba(255, 215, 0, 0.18);
    }

    tr:nth-child(even) td {
      background: rgba(255, 255, 255, 0.5);
    }

    /* 上位の行をさらに強力にゴールド強調 */
    tr:nth-child(1) td {
      background: rgba(255, 200, 0, 0.55) !important;
      font-weight: bold;
    }
    tr:nth-child(2) td {
      background: rgba(230, 230, 230, 0.5) !important;
    }
    tr:nth-child(3) td {
      background: rgba(220, 140, 60, 0.3) !important;
    }

    .rank-cell {
      width: 45px;
      text-align: center;
      font-weight: 900;
      color: #5c3a00;
    }

    .rank-icon {
      width: 26px;
      height: 26px;
      vertical-align: middle;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .name-cell {
      width: 38%;
      text-align: left;
      padding-left: 10px;
      color: #3b2500;
      word-break: break-all;
      font-weight: 700;
    }

    .score-cell {
      text-align: right;
      font-variant-numeric: tabular-nums;
      padding-right: 10px;
      color: #613d00;
      font-weight: 900;
      text-shadow: 0 1px 1px rgba(255,255,255,0.8);
    }

    .time-cell {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #7a5c22;
      padding-right: 10px;
      font-size: 12px;
      font-weight: 600;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #ffffff;
      margin-top: 30px;
      letter-spacing: 0.1em;
      text-shadow: 0 1px 3px rgba(120,70,0,0.8);
      font-weight: 700;
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← 戻る</a>

  <h1>✨ studio Y.S.N RANKING ✨</h1>

  <div id="rankingContainer"></div>

  <a href="index.html" class="back-btn">← 戻る</a>

  <div class="footer-note">
    studio Y.S.N score ranking / GAMEID 1–5
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js";

    const supabaseUrl = "https://gsgtgryjwdqhzzbcbssy.supabase.co";
    const supabaseKey = "sb_publishable_yM2UbH1x_AzebIX5WECr-w_-WbVIGrb";
    const supabase = createClient(supabaseUrl, supabaseKey);

    const GAME_NAMES = {
      1: "バトラーズショット",
      2: "襲撃のグラットン",
      3: "怪盗スプロットのハチャメチャ大作戦",
      4: "NOVA GALAXY",
      5: "レオンアドベンチャー"
    };

    function formatDate(dateStr) {
      if (!dateStr) return "-";
      const d = dateStr.split("T")[0];
      const [y, m, d2] = d.split("-");
      return `${y}/${m}/${d2}`;
    }

    function formatScore(gameId, score) {
      if (gameId === 5) {
        const h = Math.floor(score / 3600);
        const m = Math.floor((score % 3600) / 60);
        const s = score % 60;

        return (
          String(h).padStart(2, "0") + ":" +
          String(m).padStart(2, "0") + ":" +
          String(s).padStart(2, "0")
        );
      }
      return score.toLocaleString() + "点";
    }

    async function loadRanking() {
      const container = document.getElementById("rankingContainer");
      container.innerHTML = "";

      for (let gameId = 1; gameId <= 5; gameId++) {
        const { data, error } = await supabase
          .from("studio_ysn_table")
          .select("USERID, SCORE, ENTRYTIME")
          .eq("GAMEID", gameId)
          .order("SCORE", { ascending: gameId === 5 })
          .limit(10);

        const block = document.createElement("div");
        block.className = "game-block";

        const title = document.createElement("div");
        title.className = "game-title";
        title.innerHTML = `👑 ${GAME_NAMES[gameId]} 👑`;
        block.appendChild(title);

        const table = document.createElement("table");
        const thead = document.createElement("thead");
        thead.innerHTML = `
          <tr>
            <th>順位</th>
            <th>ニックネーム</th>
            <th>スコア</th>
            <th>登録日</th>
          </tr>
        `;
        table.appendChild(thead);

        const tbody = document.createElement("tbody");

        if (error) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td colspan="4" style="color:#b91c1c; font-weight:bold;">ERROR: ${error.message}</td>`;
          tbody.appendChild(tr);
        } else if (!data || data.length === 0) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td colspan="4" style="color:#7a5c22; font-weight:bold;">No entry yet.</td>`;
          tbody.appendChild(tr);
        } else {
          data.forEach((row, index) => {
            let rankIcon = index + 1;
            if (index === 0) rankIcon = `<img src="img/gameRank/rank1.png" class="rank-icon">`;
            if (index === 1) rankIcon = `<img src="img/gameRank/rank2.png" class="rank-icon">`;
            if (index === 2) rankIcon = `<img src="img/gameRank/rank3.png" class="rank-icon">`;

            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td class="rank-cell">${rankIcon}</td>
              <td class="name-cell">${row.USERID}</td>
              <td class="score-cell">${formatScore(gameId, row.SCORE)}</td>
              <td class="time-cell">${formatDate(row.ENTRYTIME)}</td>
            `;
            tbody.appendChild(tr);
          });
        }

        table.appendChild(tbody);
        block.appendChild(table);
        container.appendChild(block);
      }
    }

    loadRanking();
  </script>
</body>
</html>
