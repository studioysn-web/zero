    body {

    .slider-container {
      position: relative;

    .main-image {

    /* ===== ホットスポット共通設定 ===== */
    .hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 8px;
      animation: pulse 5s infinite ease-in-out;
      transition: box-shadow 0.3s ease, background-color 0.3s ease;
    }

    @keyframes pulse {
      0%, 40% {
        box-shadow: 0 0 0px 0px rgba(255, 255, 255, 0);
        background-color: rgba(255, 255, 255, 0);
      }
      60% {
        box-shadow: 0 0 12px 4px rgba(255, 255, 255, 0.5);
        background-color: rgba(255, 255, 255, 0.15);
      }
      80%, 100% {
        box-shadow: 0 0 0px 0px rgba(255, 255, 255, 0);
        background-color: rgba(255, 255, 255, 0);
      }
    }

    .hotspot:hover {
      animation: none;
      box-shadow: 0 0 20px 10px rgba(255, 255, 255, 0.8);
      background-color: rgba(255, 255, 255, 0.2);
    }

    .hotspot::after {
      content: attr(data-label);
      position: absolute;
      bottom: 110%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      white-space: nowrap;
      z-index: 10;
    }

    .hotspot:hover::after {
      opacity: 1;
    }

    /* ===== 【追加】一番右のスポット（spot-room0-6）専用の個別デザイン ===== */
    .spot-room0-6 {
      /* ここで他のスポットと色や光り方を変えられます */
      /* 例: ボーダーやアニメーションの変更など */
    }
    
    /* 右端スポット専用メニュー（色や枠線を別にする場合ここで調整） */
    .game-menu.menu-right-special {
      border: 2px solid #7eb9ff; /* 例として水色系の枠線に変更 */
      width: 240px; /* 必要なら幅も個別変更可能 */
    }
    .game-menu.menu-right-special li a:hover {
      background: #7eb9ff; /* ホバー時の色も水色に連動 */
      color: #111;
    }
    /* ===== メニューを「下」に表示させる設定 ===== */
    .game-menu.menu-bottom {
      bottom: auto;
      top: 55%; /* ホットスポットの下側に配置 */
      transform: translateX(-50%) translateY(-10px);
    }
    /* 下開き用が開いたときのアニメーション */
    .hotspot.is-open .game-menu.menu-bottom {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* ===== ゲーム一覧メニューのデザイン ===== */
    .game-menu {
      position: absolute;
      bottom: 105%;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid #ff7eb9;
      border-radius: 8px;
      padding: 0px;
      width: 170px;
      z-index: 30;
      
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }

    /* 右端用メニュー共通（右側にはみ出さないよう左側に寄せる） */
    .game-menu.menu-right,
    .game-menu.menu-right-special {
      left: auto;
      right: 0;
      transform: translateY(10px);
    }
    .hotspot.is-open .game-menu.menu-right,
    .hotspot.is-open .game-menu.menu-right-special {
      transform: translateY(0);
    }

    /* 開いたときのアニメーション */
    .hotspot.is-open .game-menu {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
    .hotspot.is-open .game-menu.menu-right,
    .hotspot.is-open .game-menu.menu-right-special {
      transform: translateY(0);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .game-menu ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .game-menu li {
      margin: 6px 0;
    }

    .game-menu li a {
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      display: block;
      padding: 6px 8px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .game-menu li a:hover {
      background: #ff7eb9;
      color: #111;
    }

    /* ===== 三角矢印 ===== */
    .slide-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-style: solid;
      cursor: pointer;
      transition: 0.25s;
      background: none;
      z-index: 20;
    }

    .left-btn {
      left: 20px;
      border-width: 25px 30px 25px 0;
      border-color: transparent #fff transparent transparent;
    }

    .right-btn {
      right: 20px;
      border-width: 25px 0 25px 30px;
      border-color: transparent transparent transparent #fff;
    }

    .left-btn:hover {
      border-color: transparent #ff7eb9 transparent transparent;
    }

    .right-btn:hover {
      border-color: transparent transparent transparent #ff7eb9;
    }

    /* ===== アニメーション（一方向に流れるスライド） ===== */
    .to-left-out { animation: slideToLeftOut 0.3s forwards ease-in-out; }
    .to-left-in  { animation: slideToLeftIn 0.3s forwards ease-in-out; }

    @keyframes slideToLeftOut {
      from { transform: translateX(0); opacity: 1; }
      to   { transform: translateX(-100%); opacity: 0; }
    }
    @keyframes slideToLeftIn {
      from { transform: translateX(100%); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }

    .to-right-out { animation: slideToRightOut 0.3s forwards ease-in-out; }
    .to-right-in  { animation: slideToRightIn 0.3s forwards ease-in-out; }

    @keyframes slideToRightOut {
      from { transform: translateX(0); opacity: 1; }
      to   { transform: translateX(100%); opacity: 0; }
    }
    @keyframes slideToRightIn {
      from { transform: translateX(-100%); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }

    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 9999; /* ← これが必要！ */
    }

    #overlay img {
      max-width: 65%;
      height: auto;
      display: block; /* ← これも必要 */

/* ===== スマホなどの画面が狭いときの調整 ===== */

const urlParams = new URLSearchParams(window.location.search);
const roomParam = urlParams.get('room');

let current = roomParam !== null ? parseInt(roomParam, 10) : 1;
if (isNaN(current) || current < 0 || current >= rooms.length) {
  current = 1;
}

const scene = document.getElementById("scene");
const leftBtn = document.querySelector(".left-btn");
const rightBtn = document.querySelector(".right-btn");

// --- 部屋描画 ---
function renderRoom(index) {
  const room = rooms[index];
  scene.innerHTML = `
    <img src="${room.img}" alt="room" class="main-image">
    ${room.hotspots}
  `;
  bindHotspotEvents();
}

// --- ホットスポットイベント ---
function bindHotspotEvents() {
  document.querySelectorAll('.hotspot').forEach(el => {
    el.addEventListener('click', (e) => {

      // ▼ detail をクリックしたらホットスポット処理を止める
      if (e.target.closest(".detail")) {
        return;
      }

      const link = el.getAttribute('data-link');

      if (link) {
        window.location.href = link;
      } else {
        e.stopPropagation();

        document.querySelectorAll('.hotspot').forEach(other => {
          if (other !== el) other.classList.remove('is-open');
        });

        el.classList.toggle('is-open');
      }
    });
  });
}

// --- ホットスポット外側クリックで閉じる（1回だけ登録） ---
document.addEventListener('click', (e) => {

  // ▼ detail をクリックしたら閉じる処理を止める
  if (e.target.closest(".detail")) {
    return;
  }

  document.querySelectorAll('.hotspot').forEach(el => {
    el.classList.remove('is-open');
  });
});

// --- スライド処理 ---
function updateImage(direction) {
  if (direction === "left" && current === 0) {
    window.location.href = "index.html";
    return;
  }
  if (direction === "right" && current === rooms.length - 1) {
    window.location.href = "index.html";
    return;
  }

  const outClass = direction === "left" ? "to-right-out" : "to-left-out";
  const inClass  = direction === "left" ? "to-right-in"  : "to-left-in";

  scene.className = "scene " + outClass;

  setTimeout(() => {
    current += (direction === "left" ? -1 : 1);
    renderRoom(current);
    scene.className = "scene " + inClass;
  }, 300);

  setTimeout(() => {
    scene.className = "scene";
  }, 600);
}

leftBtn.addEventListener("click", () => updateImage("left"));
rightBtn.addEventListener("click", () => updateImage("right"));

// --- 初期描画 ---
renderRoom(current);

// --- 5種類のページ配列 ---
const pagesSets = {
  detail1: ["img/retoro/anv1.png"],
  detail2: ["img/retoro/anv2.png"],
  detail3: ["img/retoro/anv1-5.png"],
  detailTera: ["img/retoro/teracitizens.png"], 
  detailSLeonRpg: ["img/retoro/r_s_0.png", "img/retoro/r_s_1.png", "img/retoro/r_s_2.png", "img/retoro/r_s_3.png", "img/retoro/r_s_4.png"],
  detailKLeonRpg: ["img/retoro/coming-soon.png"]
};

let pointa = 0;
let activePages = [];
const overlay = document.getElementById("overlay");
const img = document.getElementById("pageImage");

// --- detail クリックで overlay 表示（イベント委譲） ---
document.addEventListener("click", e => {
  const el = e.target.closest(".detail");
  if (!el) return;

  e.preventDefault();
  e.stopPropagation();

  const type = el.dataset.type;
  activePages = pagesSets[type];
  pointa = 0;

  img.src = activePages[0];
  img.style.display = "block";   // ← これが必要！

  overlay.style.display = "flex";
});


// --- overlay 背景クリックで閉じる ---
overlay.addEventListener("click", e => {
  if (e.target.id === "overlay") overlay.style.display = "none";
});

// --- ページ切り替え ---
function showPage(next) {
  if (next < 0 || next >= activePages.length) return;
  const direction = next > pointa ? "slide-left" : "slide-right";
  img.classList.add(direction);
  setTimeout(() => {
    img.src = activePages[next];
    img.classList.remove(direction);
  }, 300);
  pointa = next;
}

// --- クリックで左右めくり ---
img.addEventListener("click", e => {
  const rect = img.getBoundingClientRect();
  const x = e.clientX - rect.left;
  if (x < rect.width / 2) showPage(pointa - 1);
  else showPage(pointa + 1);
});

// --- フリック対応 ---
let startX = 0;
img.addEventListener("touchstart", e => startX = e.touches[0].clientX);
img.addEventListener("touchend", e => {
  const endX = e.changedTouches[0].clientX;
  const diff = endX - startX;
  if (diff > 50) showPage(pointa - 1);
  if (diff < -50) showPage(pointa + 1);
});
