<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パレットバトラーズ シューティング</title>

<style>
body {
  background: #000;
  margin: 0;
  padding: 0;
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ▼ ゲーム全体ラッパー（スワイプ無効の主役） */
#gameArea {
  touch-action: none;          /* ← スワイプ無効化 */
  overscroll-behavior: none;   /* ← 画面端のビヨーン防止 */
  width: 100%;
  height: 100%;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center; /* 中央寄せ */
  justify-content: flex-start;
}

/* ▼ キャンバス */
canvas {
  max-width: 100%;
  height: auto;
  border: 4px solid #fff;
  image-rendering: pixelated;
  margin-top: 90px;
}

/* ▼ ゲーム開始ボタン */
#startButton {
  margin-top: 10px;
  padding: 12px 24px;
  font-size: 22px;
  background: rgba(255,255,255,0.2);
  border: 2px solid rgba(255,255,255,0.4);
  border-radius: 10px;
  color: #fff;

  /* ★ 追加：中央寄せ */
  display: block;
  margin-left: auto;
  margin-right: auto;
}


/* ▼ 閉じるボタン */
.close-tab-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  padding: 10px 18px;
  font-size: 20px;
  font-weight: bold;
  color: #fff;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 8px;
  z-index: 9999;
  cursor: pointer;
  user-select: none;
}

.close-tab-btn:hover {
  background: rgba(0,0,0,0.7);
}

/* ▼ D-Pad */
#dpad {
  position: fixed;
  bottom: 190px;
  left: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 10;
}

#dpad button {
  width: 160px;
  height: 100px;
  font-size: 26px;
  border-radius: 10px;
  background-color: #333;
  color: white;
  border: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

/* ▼ Z ボタン */
#zpad {
  position: fixed;
  bottom: 220px;
  right: 20px;
  z-index: 10;
}

#zpad button {
  width: 160px;
  height: 160px;
  font-size: 32px;
  border-radius: 50%;
  background-color: crimson;
  color: white;
  border: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

/* ▼ スマホ調整 */
@media (max-width: 600px) {
  #dpad button {
    width: 100px;
    height: 50px;
    font-size: 22px;
  }
  #zpad button {
    width: 80px;
    height: 80px;
    font-size: 28px;
  }
}
</style>
</head>

<body>

<!-- ▼▼▼ ゲーム全体ラッパー開始 ▼▼▼ -->
<div id="gameArea">

<!-- ▼ 閉じるボタン -->
<div class="close-tab-btn" onclick="window.close()">× CLOSE</div>

<table border="0"
style="
  width:400px;
  color:white;
  position:absolute;
  top:20px;
  left: 20px;
  z-index: 9998;
">
<tr>
<td>
説明：<br>
・矢印キー上下で移動<br>
・Zキーで攻撃
</td>
<td id="hi-score"></td>
</tr>
</table>

<!-- ▼ ゲーム画面 -->
<canvas id="gameCanvas" width="800" height="600"></canvas>

<script src="shoot.js?v=2025110202"></script>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const img = new Image();
img.src = './img/start_scr.png';

img.onload = () => {
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
};

/* ▼ 長押し対策つきボタンバインド */
function bindButton(selector, key) {
  const btn = document.querySelector(selector);
  if (!btn) return;

  btn.addEventListener("mousedown", () => {
    if (key === "z") attack(direction);
    keys[key] = true;
  });
  btn.addEventListener("mouseup", () => {
    keys[key] = false;
  });

  btn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (key === "z") attack(direction);
    keys[key] = true;
  });
  btn.addEventListener("touchend", (e) => {
    e.preventDefault();
    keys[key] = false;
  });

  btn.addEventListener("contextmenu", (e) => e.preventDefault());
}

bindButton("#up", "ArrowUp");
bindButton("#down", "ArrowDown");
bindButton("#shoot", "z");
</script>

<button id="startButton" onclick="startGame()">ゲーム開始</button>

<!-- ▼ 左側：上下 -->
<div id="dpad">
  <button id="up">↑</button>
  <button id="down">↓</button>
</div>

<!-- ▼ 右側：Z -->
<div id="zpad">
  <button id="shoot">Z</button>
</div>

</div>
<!-- ▲▲▲ ゲーム全体ラッパー終了 ▲▲▲ -->

</body>
</html>
