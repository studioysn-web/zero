<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Scrolling Maze Game</title>

<style>

/* ============================
   ▼ 全体レイアウト
============================ */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
}

#gameArea {
  width: 100%;
  height: 100%;
  position: relative;
  touch-action: none;
  overscroll-behavior: none;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ============================
   ▼ キャンバス（位置固定）
============================ */
canvas {
  margin-top: 20px;
  border: 4px solid #fff;
  image-rendering: pixelated;
}

/* ============================
   ▼ START ボタン
============================ */
#startButton {
  margin-top: 10px;
  padding: 14px 28px;
  font-size: 26px;
  background: rgba(255,255,255,0.2);
  border: 2px solid rgba(255,255,255,0.4);
  border-radius: 12px;
  color: #fff;
  cursor: pointer;
  user-select: none;
}

#startButton:hover {
  background: rgba(255,255,255,0.35);
}

/* ============================
   ▼ 閉じるボタン（右上固定）
============================ */
.close-tab-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  padding: 12px 20px;
  font-size: 22px;
  font-weight: bold;
  color: #fff;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 10px;
  z-index: 9999;
  cursor: pointer;
  user-select: none;
}

.close-tab-btn:hover {
  background: rgba(0,0,0,0.7);
}

/* ============================
   ▼ 操作ボタン（共通）
============================ */
#pad-vertical button,
#pad-horizontal button {
  width: 160px;
  height: 160px;
  font-size: 48px;
  border-radius: 20px;
  background: rgba(255,255,255,0.15);
  border: 3px solid rgba(255,255,255,0.4);
  color: #fff;
  user-select: none;
  touch-action: manipulation;
}

/* ============================
   ▼ PC（小型ボタン）
============================ */
body.pc #pad-vertical button,
body.pc #pad-horizontal button {
  width: 60px;
  height: 60px;
  font-size: 22px;
  border-radius: 10px;
}

/* ============================
   ▼ スマホ（巨大ボタン）
============================ */
body.mobile #pad-vertical button,
body.mobile #pad-horizontal button {
  width: 200px;
  height: 200px;
  font-size: 72px;
  border-radius: 28px;
}

/* ============================
   ▼ ボタンコンテナ（共通初期値）
============================ */
#pad-vertical,
#pad-horizontal {
  position: fixed;
  z-index: 999;
  display: flex;
  gap: 30px;
}

/* ▼ 左側：上下（共通初期値） */
#pad-vertical {
  flex-direction: column;
  left: 20px;
  bottom: 570px;   /* ← 共通初期値 */
}

/* ▼ 右側：左右（共通初期値） */
#pad-horizontal {
  flex-direction: row;
  right: 20px;
  bottom: 800px;   /* ← 共通初期値 */
}

/* ============================
   ▼ PC 専用位置調整（ここが重要）
============================ */
body.pc #pad-vertical {
  bottom: 0px;   /* ← PC専用の高さ（自由に調整） */
}

body.pc #pad-horizontal {
  bottom: 0px;   /* ← PC専用の高さ（自由に調整） */
}

/* ============================
   ▼ スマホ専用位置調整
============================ */
body.mobile #pad-vertical {
  bottom: 570px;   /* ← スマホ専用の高さ（自由に調整） */
}

body.mobile #pad-horizontal {
  bottom: 800px;   /* ← スマホ専用の高さ（自由に調整） */
}

  /* ▼ スコア登録パネルのボタン統一 */
  .score-btn {
    width: 220px;
    padding: 12px;
    margin: 10px 0;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: block;      /* ← 縦並びにする */
    margin-left: auto;
    margin-right: auto;  /* ← 中央寄せ */
    background: #4CAF50; /* 緑（登録ボタン） */
    color: white;
  }

  .score-btn.cancel {
    background: #d9534f; /* 赤（キャンセルボタン） */
  }
</style>
</head>

<body>

<div id="gameArea">

  <div class="close-tab-btn" onclick="window.history.back()">戻る</div>

  <button id="startButton">ゲーム開始</button>

  <canvas id="game" width="900" height="700"></canvas>

  <!-- ▼ スコア登録パネル -->
  <div id="scoreEntry"
       style="position:absolute; top:75%; left:50%;
              transform:translate(-50%, -50%);
              background:rgba(0,0,0,0.85);
              padding:20px; color:white;
              border:2px solid #fff;
              border-radius:10px;
              display:none; z-index:99999;
              text-align:center;">

    <div style="font-size:20px; margin-bottom:10px;">
      名前を入力してください
    </div>

    <input type="text" id="userName" maxlength="10"
           style="font-size:20px; padding:5px; width:200px;"><br><br>

    <button id="registerScoreBtn" class="score-btn">
      このスコアを登録
    </button>

    <button id="cancelScoreBtn" class="score-btn cancel">
      キャンセル
    </button>

    <div id="scoreEntryResult" style="margin-top:10px; font-size:16px;"></div>
  </div>

  <div id="pad-vertical">
    <button id="btn-up">↑</button>
    <button id="btn-down">↓</button>
  </div>

  <div id="pad-horizontal">
    <button id="btn-left">←</button>
    <button id="btn-right">→</button>
  </div>

</div>

<script>
if (/Android.+Mobile|iPhone|iPad|iPod/.test(navigator.userAgent)) {
  document.body.classList.add("mobile");
} else {
  document.body.classList.add("pc");
}
</script>

<!-- ★ Supabase と loadHighScore を先に読み込む -->
<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js";

  const supabase = createClient(
    "https://gsgtgryjwdqhzzbcbssy.supabase.co",
    "sb_publishable_yM2UbH1x_AzebIX5WECr-w_-WbVIGrb"
  );

  window.loadHighScore = async function () {
    
    const { data, error } = await supabase
      .from("studio_ysn_table")
      .select("SCORE")
      .eq("GAMEID", 3)
      .not("SCORE", "is", null)   // ★ null除外
      .order("SCORE", { ascending: false })
      .limit(1);

    if (error || !data || data.length === 0) return 0;
    console.log(data[0].SCORE);
    return data[0].SCORE;
  };

  document.getElementById("registerScoreBtn").addEventListener("click", async () => {
    const name = document.getElementById("userName").value.trim();
    const panel = document.getElementById("scoreEntry");
    const score = Number(panel.dataset.score);

    if (!name) {
      document.getElementById("scoreEntryResult").innerText = "名前を入力してください。";
      return;
    }

    const { error } = await supabase
      .from("studio_ysn_table")
      .insert([
        {
          GAMEID: 3,
          USERID: name,
          SCORE: score,
          ENTRYTIME: new Date().toISOString()
        }
      ]);

    if (error) {
      document.getElementById("scoreEntryResult").innerText = "登録失敗: " + error.message;
    } else {
      window.highScore = await window.loadHighScore();
      panel.style.display = "none";
    }
  });

  document.getElementById("cancelScoreBtn").addEventListener("click", () => {
    document.getElementById("scoreEntry").style.display = "none";
    document.getElementById("scoreEntryResult").innerText = "";
  });
</script>

<!-- ★ ゲームロジックは必ず最後に読み込む -->
<script src="./splot.js"></script>

</body>
</html>
