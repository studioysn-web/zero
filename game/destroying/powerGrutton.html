<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<!-- ★★★ スマホCSSが効くようになる最重要行 ★★★ -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grutton Game</title>

<style>
  body {
    background: #222;
    margin: 0;
    padding: 0;
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* ▼ ゲーム全体を包むラッパー（スワイプ無効の主役） */
  #gameArea {
    touch-action: none;          /* ← スワイプ無効化 */
    overscroll-behavior: none;   /* ← 画面端のビヨーン防止 */
    width: 100%;
    height: 100%;
    position: relative;
  }

  /* ▼ canvas を中央固定から外して上に寄せる（スマホで暴れない） */
  canvas {
    position: absolute;
    top: 120px;
    left: 50%;
    transform: translateX(-50%);
    background: #000;
    image-rendering: pixelated;
    border: 4px solid #fff;
    width: 100%;
    height: auto;
    max-width: 800px;
    z-index: 1;
  }

  .start-btn {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 60px;
    font-size: 28px;
    font-weight: bold;
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 14px;
    color: #fff;
    z-index: 10;
  }

  /* ▼ D-Pad（PC用） */
  .dpad {
    position: absolute;
    bottom: 80px;
    left: 20px;
    width: 180px;
    height: 180px;
    z-index: 10;
  }

  .btn.up    { top: 0; left: 50%; transform: translateX(-50%); }
  .btn.left  { top: 50%; left: 0; transform: translateY(-50%); }
  .btn.right { top: 50%; right: 0; transform: translateY(-50%); }
  .btn.down  { bottom: 0; left: 50%; transform: translateX(-50%); }

  .btn {
    position: absolute;
    width: 60px;
    height: 60px;
    font-size: 26px;
    font-weight: bold;
    background: rgba(4, 219, 226, 0.15);
    border: 2px solid rgba(22, 170, 138, 0.35);
    border-radius: 14px;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  .z-btn {
    position: absolute;
    bottom: 180px;
    right: 20px;
    width: 160px;
    height: 160px;
    font-size: 40px;
    font-weight: bold;
    background: rgba(255,80,80,0.25);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 50%;
    color: #fff;
    z-index: 10;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  /* ▼ ★★★ スマホCSS（viewport追加で確実に効く） ★★★ */
  @media (max-width: 900px) {

    canvas {
      top: 150px;
      max-width: 100%;
    }

    
  .dpad {
    width: 190px;
    height: 150px;
    bottom: 100px;   /* ← 160px → 240px に変更（80px 上へ） */
    left: 10px;
  }

  .btn {
    width: 60px;
    height: 60px;
    font-size: 22px;
  }

  .z-btn {
    width: 110px;
    height: 110px;
    font-size: 32px;
    bottom: 210px;   /* ← 200px → 260px に変更（60px 上へ） */
    right: 0px;
  }

  .start-btn {
    bottom: 260px;   /* ← 70px → 160px に変更（90px 上へ） */
  }
  }

  /* ▼ × CLOSE ボタン */
  .close-tab-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 10px 18px;
    font-size: 22px;
    font-weight: bold;
    color: #fff;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    z-index: 9999;
    cursor: pointer;
  }
  .close-tab-btn:hover {
    background: rgba(0,0,0,0.65);
  }
</style>
</head>

<body>

<!-- ▼▼▼ 追加：ゲーム全体を包むラッパー ▼▼▼ -->
<div id="gameArea">

<div class="close-tab-btn" onclick="window.close()">× CLOSE</div>

<div class="game-desc" style="
  position:absolute;
  top:70px;
  left:20px;
  color:white;
  font-size:18px;
  z-index:9000;
">
  説明：<br>
  ・矢印キーで移動<br>
  ・Zキーで破壊 (最高得点を狙え！)
</div>

<canvas id="gameCanvas" width="800" height="400"></canvas>

<button id="startBtn" class="start-btn">START</button>

<div class="dpad">
  <button class="btn up">↑</button>
  <button class="btn left">←</button>
  <button class="btn right">→</button>
  <button class="btn down">↓</button>
</div>

<button class="z-btn">Z</button>

</div>
<!-- ▲▲▲ ラッパーここまで ▲▲▲ -->

<script src="grutton.js"></script>

<script>
function bindButton(selector, key) {
  const btn = document.querySelector(selector);
  if (!btn) return;

  btn.addEventListener("mousedown", () => {
    if (key === "z") attack(direction);
    keys[key] = true;
  });
  btn.addEventListener("mouseup", () => {
    keys[key] = false;
  });

  btn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (key === "z") attack(direction);
    keys[key] = true;
  });
  btn.addEventListener("touchend", (e) => {
    e.preventDefault();
    keys[key] = false;
  });
}

bindButton(".btn.up", "ArrowUp");
bindButton(".btn.down", "ArrowDown");
bindButton(".btn.left", "ArrowLeft");
bindButton(".btn.right", "ArrowRight");
bindButton(".z-btn", "z");
</script>

</body>
</html>
