<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Leon Adventure RPG Proto</title>
  <link rel="stylesheet" href="rpg.css">
</head>
<body>
  <div id="game-wrapper">
    <canvas id="game-canvas" width="760" height="520"></canvas>

    <div id="ui-wrapper">
      <div class="ui-column" id="ui-left">
        <div class="dpad-row">
          <button class="btn dpad" data-key="ArrowUp">▲</button>
        </div>
        <div class="dpad-row">
          <button class="btn dpad" data-key="ArrowLeft">◀</button>
          <button class="btn dpad" data-key="ArrowDown">▼</button>
          <button class="btn dpad" data-key="ArrowRight">▶</button>
        </div>
      </div>

      <div class="ui-column" id="ui-center">
        <button class="btn action" data-key="KeyZ">Z<br>決定</button>
        <button class="btn action" data-key="Enter">START</button>
        <button class="btn action" data-key="KeyL">LOAD</button>
      </div>

      <div class="ui-column" id="ui-right">
        <button class="btn action" data-key="KeyX">X<br>キャンセル</button>
      </div>
    </div>
  </div>

  <script src="rpg.js"></script>
</body>
</html>
