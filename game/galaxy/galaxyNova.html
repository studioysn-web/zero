<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Galaxy Invader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #000;
  font-family: sans-serif;
  color: #000;
  overflow: hidden;
  display: block;   /* ← flex をやめる */
}

  /* ▼ スワイプ無効化（超重要） */
  #gameArea {
    touch-action: none;
    overscroll-behavior: none;
    width: 100%;
    height: 100%;
    position: relative;
  }

  #top-bar {
    width: 100%;
    max-width: 720px;
    display: flex;
    justify-content: flex-end;
    padding: 8px 12px;
    box-sizing: border-box;
  }

#game-container {
  position: relative;
  width: 100%;
  display: flex;
  justify-content: center;   /* ← 横中央 */
}
.close-tab-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  padding: 10px 18px;
  font-size: 20px;
  font-weight: bold;
  color: #fff;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 8px;
  z-index: 9999;
  cursor: pointer;
}
  canvas {
    background: #000;
    display: block;
    border: 4px solid #fff;
  }



  #center-message {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: #ffff66;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 0 0 8px #000;
    pointer-events: none;
    display: none;
  }

  #game-over-overlay {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  
  /* ▼ 黒い背景パネル */
  background: rgba(0, 0, 0, 0.8);
  padding: 30px 40px;
  border-radius: 12px;

  /* ▼ 文字 */
  color: #fff;
  font-size: 28px;
  font-weight: bold;
  text-align: center;

  /* ▼ 影で少し立体感 */
  box-shadow: 0 0 20px rgba(0,0,0,0.6);

  z-index: 999;
  display: none;
  
  }

  #game-over-overlay .title {
    font-size: 36px;
    margin-bottom: 16px;
  }

  #game-over-overlay .score {
    font-size: 20px;
    margin-bottom: 8px;
  }

  #game-over-overlay .highscore {
    font-size: 18px;
    color: #ffff66;
  }

#dpad {
  position: fixed;
  bottom: 155px;
  left: 310px;
  display: flex;
  flex-direction: row;   /* ← 横並びに変更 */
  gap: 12px;
  z-index: 20;
}

#dpad button {
  width: 70px;
  height: 50px;
  font-size: 32px;
  border-radius: 10px;
  background-color: #333;
  color: white;
  border: none;
  user-select: none;
}

  /* ▼ Z ボタン */
  #zpad {
    position: fixed;
    bottom: 100px;
    right: 300px;
    z-index: 20;
  }

  #zpad button {
    width: 100px;
    height: 100px;
    font-size: 32px;
    border-radius: 50%;
    background-color: crimson;
    color: white;
    border: none;
    user-select: none;
  }
  #start-button {
  position: fixed;
  top: 80%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 14px 28px;
  font-size: 18px;
  background: rgba(255,255,255,0.2);
  border: 2px solid rgba(255,255,255,0.4);
  border-radius: 10px;
  color: #fff;
  z-index: 30;
}

  #close-button {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 6px 10px;
    background: #222;
    color: #fff;
    border-radius: 6px;
    font-size: 16px;
    z-index: 20;
  }
  
  #game-canvas {
    margin-top: 60px; /* ← スコアとクローズの分だけ下げる */
  }
  /* ▼ スマホ調整 */
  @media (max-width: 600px) {
  #start-button {
  position: fixed;
  top: 80%;
  left: 58%;
  transform: translate(-50%, -50%);
  padding: 14px 28px;
  font-size: 18px;
  background: rgba(255,255,255,0.2);
  border: 2px solid rgba(255,255,255,0.4);
  border-radius: 10px;
  color: #fff;
  z-index: 30;
}
#dpad {
  position: fixed;
  bottom: 120px;
  left: 10px;
  display: flex;
  flex-direction: row;   /* ← 横並びに変更 */
  gap: 12px;
  z-index: 20;
}

#dpad button {
  width: 70px;
  height: 50px;
  font-size: 32px;
  border-radius: 10px;
  background-color: #333;
  color: white;
  border: none;
  user-select: none;
}
  /* ▼ Z ボタン */
  #zpad {
    position: fixed;
    bottom: 80px;
    right: 0px;
    z-index: 20;
  }
  }

  /* ▼ スコア登録パネルのボタン統一 */
  .score-btn {
    width: 220px;
    padding: 12px;
    margin: 10px 0;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: block;      /* ← 縦並びにする */
    margin-left: auto;
    margin-right: auto;  /* ← 中央寄せ */
    background: #4CAF50; /* 緑（登録ボタン） */
    color: white;
  }

  .score-btn.cancel {
    background: #d9534f; /* 赤（キャンセルボタン） */
  }
 #score-container {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 20px; /* ← HIGH と SCORE の距離 */
  font-size: 20px;
  z-index: 20;
}
#score-container {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 20px;
  font-size: 20px;
  z-index: 20;
}

#highscore-display {
  color: rgb(245, 9, 9);
  font-weight: bold;
}

#score-display {
  color: white;
  font-weight: bold;
}

</style>
</head>

<body>
<div id="gameArea">

<div id="score-container">
  <span id="highscore-display">HIGH: 0</span>
  <span id="score-display">SCORE: 0</span>
</div>
<div id="close-button">戻る</div>

  <div id="game-container">
    <canvas id="game-canvas"></canvas>

<div id="scoreEntry"
     style="position:absolute; top:85%; left:50%;
            transform:translate(-50%, -50%);
            background:rgba(0,0,0,0.85);
            padding:20px; color:white;
            border:2px solid #fff;
            border-radius:10px;
            display:none; z-index:99999;
            text-align:center;">

  <div style="font-size:20px; margin-bottom:10px;">
    名前を入力してください
  </div>

  <input type="text" id="userName" maxlength="10"
         style="font-size:20px; padding:5px; width:200px;"><br><br>

  <button id="registerScoreBtn" class="score-btn">
    このスコアを登録
  </button>

  <button id="cancelScoreBtn" class="score-btn cancel">
    キャンセル
  </button>

  <div id="scoreEntryResult" style="margin-top:10px; font-size:16px;"></div>
</div>
    <div id="center-message"></div>

    <div id="game-over-overlay">
      <div class="title">GAME OVER</div>
      <div class="score" id="final-score"></div>
      <div class="highscore" id="high-score"></div>
    </div>
  </div>

  <button id="start-button">START</button>

  <!-- ▼ 左右パッド -->
  <div id="dpad">
    <button id="left">←</button>
    <button id="right">→</button>
  </div>

  <!-- ▼ Z パッド -->
  <div id="zpad">
    <button id="shoot">Z</button>
  </div>

</div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js";

// ★ Supabase 接続
const supabase = createClient(
  "https://gsgtgryjwdqhzzbcbssy.supabase.co",
  "sb_publishable_yM2UbH1x_AzebIX5WECr-w_-WbVIGrb"
);

// ★ ハイスコア取得
window.loadHighScore = async function () {
  const { data, error } = await supabase
    .from("studio_ysn_table")
    .select("SCORE")
    .eq("GAMEID", 4)
    .order("SCORE", { ascending: false })
    .limit(1);

  if (error || !data || data.length === 0) return 0;
  return data[0].SCORE;
};

// ★ スコア登録ボタン
document.getElementById("registerScoreBtn").addEventListener("click", async () => {
  const name = document.getElementById("userName").value.trim();
  const panel = document.getElementById("scoreEntry");
  const score = Number(panel.dataset.score);

  if (!name) {
    document.getElementById("scoreEntryResult").innerText = "名前を入力してください。";
    return;
  }

  const { data, error } = await supabase
    .from("studio_ysn_table")
    .insert([
      {
        GAMEID: 4,
        USERID: name,
        SCORE: score,
        ENTRYTIME: new Date().toISOString()
      }
    ]);

  if (error) {
    document.getElementById("scoreEntryResult").innerText = "登録失敗: " + error.message;
  } else {
    //document.getElementById("scoreEntryResult").innerText = "登録成功！";

    // ★ ハイスコア再取得
    window.highScore = await window.loadHighScore();

    panel.style.display = "none";
  }
});

// ★ キャンセルボタン
document.getElementById("cancelScoreBtn").addEventListener("click", () => {
  document.getElementById("scoreEntry").style.display = "none";
  document.getElementById("scoreEntryResult").innerText = "";
});

/* ▼ パッド入力を nova.js の keys[] に連動させる */
function bindButton(selector, key, onPress) {
  const btn = document.querySelector(selector);
  if (!btn) return;

  const press = () => {
    keys[key] = true;
    if (onPress) onPress();
  };
  const release = () => {
    keys[key] = false;
  };

  btn.addEventListener("mousedown", press);
  btn.addEventListener("mouseup", release);
  btn.addEventListener("mouseleave", release);

  btn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    press();
  });
  btn.addEventListener("touchend", (e) => {
    e.preventDefault();
    release();
  });
}

bindButton("#left", "arrowleft");
bindButton("#right", "arrowright");
bindButton("#shoot", "z", () => {
  if (isGameRunning && !isGameOver) shootBullet();
});
</script>

<script src="./nova.js"></script>
</body>
</html>
