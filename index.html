<body>

<!-- 透過レイヤー（初期は非表示） -->
<div id="overlay" class="overlay">
  <div id="book" class="book">
    <img id="pageImage" class="page-image" src="img/retoro/1-1.png">
  </div>
  <!-- ▼ お知らせパネル（縦スクロール） -->
  <div id="updatePanel"></div>
</div>

<!-- 全体を包むコンテナ -->
<div class="container">
  
  <!-- タイトル -->
  <div class="title-wrapper">
    <img src="img/retoro/title.png" alt="studio Y.S.N" class="title-image">
  </div>

  <!-- 商店街画像＋ホットスポット -->
  <div class="scene">
    <img src="img/retoro/top.png" alt="いぐ商店街" class="main-image">
    <!-- お知らせ -->
    <div class="hotspot update" data-label="お知らせ掲示板"></div>
    <!-- ガチャ（冊子表示） -->
    <div class="hotspot gacha" data-label="about パレットバトラーズ"></div>

    <!-- ゲーム機 -->
    <div class="hotspot arcade1" data-label="ゲームセンターへ" data-link="inside1.html?room=0"></div>
    <div class="hotspot arcade2" data-label="ゲームセンターへ" data-link="inside1.html?room=0"></div>

    <!-- パーカー -->
    <div class="hotspot ysnarea1" data-label="YSNグッズエリアへ" data-link="inside1.html?room=2"></div>
    <div class="hotspot ysnarea2" data-label="YSNグッズエリアへ" data-link="inside1.html?room=2"></div>
    
    <!-- 入り口 -->
    <div class="hotspot entrance" data-label="中へ入る" data-link="inside1.html?room=1"></div>
  </div>

  <font style="color:white;">気になる個所をタップして入店</font>
</div>

<script>
  // ホットスポットリンク処理
  document.querySelectorAll('.hotspot').forEach(el => {
    el.addEventListener('click', () => {
      const link = el.getAttribute('data-link');
      if (link) window.location.href = link;
    });
  });

  // ガチャクリックでレイヤー表示
document.querySelector('.gacha').addEventListener('click', () => {

  // ▼ 絵本を復活させる
  document.getElementById('book').style.display = 'block';
  document.getElementById('pageImage').style.display = 'block';

  // ▼ お知らせパネルは消す
  document.getElementById('updatePanel').style.display = 'none';

  // ▼ overlay を表示
  document.getElementById('overlay').style.display = 'flex';
});


  // レイヤー外クリックで閉じる
  document.getElementById('overlay').addEventListener('click', (e) => {
    if (e.target.id === 'overlay') {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('pageImage').style.display = 'none';
      document.getElementById('updatePanel').style.display = 'none';
    }
  });



  // 絵本ページ配列
  const pages = [
    "img/retoro/1-1.png",
    "img/retoro/1-2.png",
    "img/retoro/1-3.png"
  ];

  let current = 0;
  const img = document.getElementById("pageImage");

  // ページ切り替え
  function showPage(next) {
    if (next < 0 || next >= pages.length) return;

    const direction = next > current ? "slide-left" : "slide-right";

    img.classList.add(direction);

    setTimeout(() => {
      img.src = pages[next];
      img.classList.remove(direction);
    }, 300);

    current = next;
  }

  // クリックで左右判定してページめくり
  img.addEventListener("click", (e) => {
    const rect = img.getBoundingClientRect();
    const x = e.clientX - rect.left;

    if (x < rect.width / 2) {
      // 左側クリック → 戻る
      showPage(current - 1);
    } else {
      // 右側クリック → 進む
      showPage(current + 1);
    }
  });


  // フリックでめくる
  let startX = 0;

  img.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
  });

  img.addEventListener("touchend", e => {
    const endX = e.changedTouches[0].clientX;
    const diff = endX - startX;

    if (diff > 50) showPage(current - 1);
    if (diff < -50) showPage(current + 1);
  });



      // ▼ UPDATE（お知らせ）クリックでテキスト表示

        <li><span class="date">2026/07/28</span><br/>【予告】現在作成中のRPGについて、boothにて教材として発売予定 studio Y.S.N RPG FrameWork</li>
        <li><span class="date">2026/07/28</span><br/>【予告】8月上旬からstudio Y.S.Nトートバッグ発売予定</li>
        <li><span class="date">2026/07/26</span><br/>after100years完結！本編はプロット作成中</li>
        <li><span class="date">2026/06/27</span><br/>minneにてミニチュアパッケージ販売開始</li>
        <li><span class="date">2026/06/21</span><br/>vol.1ミニチュアパッケージ制作中</li>
        <li><span class="date">2026/06/11</span><br/>minneにてスタッフパーカー発売開始</li>
        <li><span class="date">2026/06/07</span><br/>ミニゲーム「レオンRPG(仮)」開発中</li>
        <li><span class="date">2026/05/05</span><br/>ミニゲーム「パレットバトラーズ将棋」追加</li>
        <li><span class="date">2026/04/27</span><br/>ミニゲーム「怪盗スプロット」追加</li>
        <li><span class="date">2026/04/26</span><br/>vol.3のストーリーを追加</li>

        <li><span class="date">2026/04/10</span><br/>ミニゲームNOVA GALAXY！追加</li>

        <li><span class="date">2026/03/28</span><br/>門司港カーブーツ出店決定</li>
        <li><span class="date">2026/02/07</span><br/>「小説家なろう」よりパレットバトラーズ after 100 years の連載開始(毎週日曜更新)</li>
        <li><span class="date">2026/01/26</span><br/>ラインスタンプ 「パレバト!」販売開始</li>
        <li><span class="date">2026/11/17</span><br/>パレットバトラーズ(vol.3)販売開始</li>

    });


  
</script>

</body>
</html>
